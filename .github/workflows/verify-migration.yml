name: Compare migrated Maths Words Lab with Netlify
on:
  pull_request:
    paths:
      - index.html
      - scripts/verify-netlify-parity.mjs
      - .github/workflows/verify-migration.yml

permissions:
  contents: read

jobs:
  live-netlify-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-netlify-parity.mjs
