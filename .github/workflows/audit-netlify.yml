name: Audit live Maths Words Lab before migration
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-live-netlify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-live-netlify.mjs
